name: Agent Skills validation

on:
  push:
    paths:
      - ".github/scripts/agent-skills-workflow.test.mjs"
      - ".github/workflows/agent-skills-validation.yml"
      - "manifest.json"
      - "package.json"
      - "skills/**"
  pull_request:
    paths:
      - ".github/scripts/agent-skills-workflow.test.mjs"
      - ".github/workflows/agent-skills-validation.yml"
      - "manifest.json"
      - "package.json"
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Agent Skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the validator invocation
        run: node --test .github/scripts/agent-skills-workflow.test.mjs

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the Agent Skills reference validator
        run: python -m pip install --disable-pip-version-check skills-ref==0.1.1

      - name: Verify the skill manifest
        shell: bash
        run: |
          if ! jq -e '
            .schemaVersion == 1
            and (
              .skills
              | type == "array"
                and length > 0
                and all(.[]; type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$"))
                and length == (unique | length)
            )
          ' manifest.json > /dev/null; then
            echo "manifest.json must use schemaVersion 1 and list unique, lowercase-kebab skill names." >&2
            exit 1
          fi

          loose_entries="$(find skills -mindepth 1 -maxdepth 1 -not -type d -printf '%f\n' | sort)"
          if [[ -n "$loose_entries" ]]; then
            echo "skills/ may contain only skill directories. Unexpected entries:" >&2
            printf '%s\n' "$loose_entries" | sed 's/^/  /' >&2
            exit 1
          fi

          work="$(mktemp -d)"
          jq -r '.skills[]' manifest.json | sort > "$work/manifest"
          find skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > "$work/directories"
          jq -r '.files[] | select(startswith("skills/")) | ltrimstr("skills/") | sub("/$"; "")' \
            package.json | sort > "$work/published"

          if ! diff --unified=0 --label manifest.json --label 'skills/ directories' \
            "$work/manifest" "$work/directories"; then
            echo "manifest.json does not match the skill directories." >&2
            exit 1
          fi

          if ! diff --unified=0 --label 'skills/ directories' --label 'package.json files' \
            "$work/directories" "$work/published"; then
            echo "package.json files does not publish every skill directory." >&2
            exit 1
          fi

      - name: Validate every skill
        shell: bash
        run: |
          mapfile -d '' skill_dirs < <(
            find skills -mindepth 1 -maxdepth 1 -type d -print0 | sort -z
          )

          if (( ${#skill_dirs[@]} == 0 )); then
            echo "No skill directories found under skills/." >&2
            exit 1
          fi

          for skill_dir in "${skill_dirs[@]}"; do
            python -c 'from skills_ref.cli import main; main()' validate "$skill_dir"
          done
