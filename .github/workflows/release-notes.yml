name: Release notes

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-notes-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'chaobrain/BrainX-skill' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test release-note generation
        run: node --test .github/scripts/prepare-release.test.mjs

      - name: Recover a missing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_version="$(node -p "require('./package.json').version")"
          current_tag="v${current_version}"
          if git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null &&
             ! gh release view "${current_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${current_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "BrainX Skill ${current_version}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Prepare version and detailed notes
        id: release
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node .github/scripts/prepare-release.mjs

      - name: Commit and tag the version record
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md RELEASE_NOTES.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "BrainX Skill ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

      - name: Publish detailed GitHub Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BrainX Skill ${VERSION}" \
            --notes-file RELEASE_NOTES.md
