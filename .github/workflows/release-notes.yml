name: Release npm package and notes

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'chaobrain/BrainX-skill' &&
      github.ref == 'refs/heads/main'
    environment:
      name: npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test release tooling
        run: npm test

      - name: Recover an incomplete tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          current_version="$(node -p "require('./package.json').version")"
          current_tag="v${current_version}"
          if git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null &&
             ! gh release view "${current_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            npm_exists="$(node .github/scripts/npm-registry.mjs exists "${package_name}" "${current_version}")"
            recovery_dir="$(mktemp -d)"
            git worktree add --detach "${recovery_dir}" "${current_tag}"
            trap 'git worktree remove --force "${recovery_dir}" >/dev/null 2>&1 || true' EXIT
            if [ "${npm_exists}" != "true" ]; then
              (
                cd "${recovery_dir}"
                npm publish --provenance --access public
              )
            fi
            gh release create "${current_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "BrainX Skill ${current_version}" \
              --notes-file "${recovery_dir}/RELEASE_NOTES.md"
            git worktree remove --force "${recovery_dir}"
            trap - EXIT
          fi

      - name: Read latest npm version
        id: npm
        run: |
          package_name="$(node -p "require('./package.json').name")"
          latest="$(node .github/scripts/npm-registry.mjs latest "${package_name}")"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Prepare version and detailed notes
        id: release
        env:
          NPM_PUBLISHED_VERSION: ${{ steps.npm.outputs.latest }}
        run: node .github/scripts/prepare-release.mjs

      - name: Verify target npm version is available
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          exists="$(node .github/scripts/npm-registry.mjs exists "${package_name}" "${VERSION}")"
          if [ "${exists}" = "true" ]; then
            echo "npm ${package_name}@${VERSION} already exists" >&2
            exit 1
          fi

      - name: Validate package contents
        if: steps.release.outputs.skip != 'true'
        run: npm pack --dry-run

      - name: Commit and tag the version record
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md RELEASE_NOTES.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "BrainX Skill ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

      - name: Publish npm package
        if: steps.release.outputs.skip != 'true'
        run: npm publish --provenance --access public

      - name: Publish detailed GitHub Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BrainX Skill ${VERSION}" \
            --notes-file RELEASE_NOTES.md
